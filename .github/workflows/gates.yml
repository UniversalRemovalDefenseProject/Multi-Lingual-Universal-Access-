name: gates

# Runs on every PR, and on push to main so the protected branch's head is
# re-verified after a merge. Each gate is its own job; they start together (no
# gate depends on another's artifact) and the single `gates` job aggregates them.
on:
  pull_request:
  push:
    branches: [main]

# One run per ref; a new push cancels the in-flight run for that ref.
concurrency:
  group: gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; no job needs more.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  GITLEAKS_VERSION: "8.30.1"
  ACTIONLINT_VERSION: "1.7.12"

jobs:
  # ---- static: format, lint, security lint, boot check, migration drift, i18n build ----
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_SETTINGS_MODULE: urdp.settings
      SECRET_KEY: ci-not-a-secret
      DEBUG: "True"
      # Static checks import settings but never open a DB connection.
      POSTGRES_DB: urdp
      POSTGRES_USER: urdp
      POSTGRES_PASSWORD: ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y gettext  # msgfmt for compilemessages
      - run: pip install -r requirements-dev.txt
      - name: format
        run: ruff format --check .
      - name: lint (+ security, django rules)
        run: ruff check .
      - name: django boot check
        run: python manage.py check
      - name: migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: i18n build
        run: python manage.py compilemessages --ignore='*/site-packages/*'

  # ---- tests: unit + integration against a real Postgres, under coverage ----
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: urdp
          POSTGRES_USER: urdp
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urdp -d urdp"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: urdp.settings
      SECRET_KEY: ci-not-a-secret
      DEBUG: "True"
      POSTGRES_DB: urdp
      POSTGRES_USER: urdp
      POSTGRES_PASSWORD: ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y gettext  # msgfmt for compilemessages
      - run: pip install -r requirements-dev.txt
      # Compile translation catalogs before tests, same as entrypoint.sh does at
      # runtime. .mo files are gitignored, so tests that assert translated output
      # need them built here (this job runs on its own runner, separate from `static`).
      - run: python manage.py compilemessages --ignore='*/site-packages/*'
      - name: tests + coverage ratchet
        run: |
          coverage run manage.py test
          coverage report  # fail_under lives in pyproject.toml

  # ---- audit: known CVEs in the dependency closure ----
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements-dev.txt
      - name: pip-audit
        run: pip-audit -r requirements.txt

  # ---- secrets: scan the PR/push commit range for committed credentials ----
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0          # need history to diff the range
          persist-credentials: false
      - name: install gitleaks (pinned)
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: scan commit range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          echo "scanning $range"
          gitleaks git --no-banner --redact --log-opts="$range"

  # ---- workflows: lint the CI workflows themselves (syntax + injection checks) ----
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: install actionlint (pinned)
        run: |
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin actionlint
          actionlint --version
      - name: actionlint
        run: actionlint

  # ---- gates: THE single required check. Fails on any non-success above. ----
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [static, tests, audit, secrets, workflows]
    steps:
      - name: Require every gate to have succeeded
        run: |
          results='${{ join(needs.*.result, ',') }}'
          echo "gate results: $results"
          IFS=','
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::a gate did not succeed (got '$r') — blocking."
              exit 1
            fi
          done
          echo "all gates succeeded"
