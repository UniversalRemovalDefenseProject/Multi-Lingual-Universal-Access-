name: Nudge and unassign stale issues

on:
  schedule:
    - cron: '0 12 * * *'  # runs daily at 12:00 UTC
  workflow_dispatch: {}

env:
  NUDGE_DAYS: 10               # days of inactivity before a nudge comment is posted
  UNASSIGN_DAYS: 14            # days of inactivity before the issue is unassigned
  KEEP_LABEL: keep-assigned    # issues with this label are excluded from nudging and unassignment

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  check-stale-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Check assigned issues for staleness
        uses: actions/github-script@v7
        env:
          NUDGE_DAYS: ${{ env.NUDGE_DAYS }}
          UNASSIGN_DAYS: ${{ env.UNASSIGN_DAYS }}
          KEEP_LABEL: ${{ env.KEEP_LABEL }}
        with:
          script: |
            // Fetch open issues that currently have an assignee.

            // For each issue, determine the most recent activity timestamp from:
            //   - issue comments
            //   - the linked pull request's updated_at, where the PR references the issue
            //   - commits on a branch matching feat/issue-{N}-*, where no PR exists yet

            // Exclude an issue from further processing if:
            //   - it has the KEEP_LABEL label
            //   - it was assigned fewer than NUDGE_DAYS days ago

            // For remaining issues, based on days since last activity:
            //   - >= UNASSIGN_DAYS: remove the assignee and post a comment
            //     noting the issue is available again.
            //     This repo has no separate in-progress label; assignee
            //     presence is the sole in-progress indicator. If such a
            //     label is introduced later, it should be removed here
            //     alongside unassignment.
            //   - >= NUDGE_DAYS and < UNASSIGN_DAYS: post a comment tagging
            //     the assignee to confirm the issue is still being worked on.
            //   - otherwise: no action.