name: Nudge and unassign stale issues

on:
  schedule:
    - cron: '0 12 * * *'  # runs daily at 12:00 UTC
  workflow_dispatch: {}

env:
  NUDGE_DAYS: 10               # days of inactivity before a nudge comment is posted
  UNASSIGN_DAYS: 14            # days of inactivity before the issue is unassigned
  KEEP_LABEL: keep-assigned    # issues with this label are excluded from nudging and unassignment

permissions:
  issues: write

concurrency:
  group: stale-issue-workflow
  cancel-in-progress: false

jobs:
  check-stale-issues:
    runs-on: ubuntu-latest

    steps:
      - name: Check assigned issues for staleness
        uses: actions/github-script@v7
        env:
          NUDGE_DAYS: ${{ env.NUDGE_DAYS }}
          UNASSIGN_DAYS: ${{ env.UNASSIGN_DAYS }}
          KEEP_LABEL: ${{ env.KEEP_LABEL }}
        with:
          script: |
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });

            // Keep only real issues with at least one assignee.
            const assignedIssues = openIssues.filter(
              (item) =>
                !item.pull_request &&
                item.assignees &&
                item.assignees.length > 0
            );

            core.info(
              `Found ${assignedIssues.length} open, assigned issue(s) to evaluate.`
            );

            const nudgeDays = Number(process.env.NUDGE_DAYS);
            const unassignDays = Number(process.env.UNASSIGN_DAYS);
            const keepLabel = process.env.KEEP_LABEL;
            const nudgeMarker = "<!-- stale-issue-nudge -->";

            // Validate workflow thresholds before processing issues.
            if (
              !Number.isFinite(nudgeDays) ||
              !Number.isFinite(unassignDays) ||
              nudgeDays <= 0 ||
              unassignDays <= 0 ||
              unassignDays < nudgeDays
            ) {
              core.setFailed(
                "Invalid stale issue thresholds: NUDGE_DAYS and UNASSIGN_DAYS must be positive numbers, and UNASSIGN_DAYS must be greater than or equal to NUDGE_DAYS."
              );
              return;
            }

            const now = new Date();

            function daysSince(dateString) {
              if (!dateString) return Infinity;

              const then = new Date(dateString);
              return (now - then) / (1000 * 60 * 60 * 24);
            }

            function latest(timestamps) {
              const valid = timestamps.filter(Boolean);

              return valid.length > 0
                ? valid.reduce((a, b) => (a > b ? a : b))
                : null;
            }

            for (const issue of assignedIssues) {
              const issueNumber = issue.number;

              try {
                // Skip issues explicitly marked to remain assigned.
                const hasKeepLabel = issue.labels.some(
                  (label) => label.name === keepLabel
                );

                if (hasKeepLabel) {
                  core.info(
                    `#${issueNumber}: has "${keepLabel}" label, skipping.`
                  );
                  continue;
                }

                // Get issue comments.
                const comments = await github.paginate(
                  github.rest.issues.listComments,
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    per_page: 100,
                  }
                );

                // Only human comments count as activity.
                // This means replies to the bot's nudge also count as activity.
                const humanComments = comments.filter(
                  (comment) => comment.user.type !== "Bot"
                );

                const lastCommentAt = latest(
                  humanComments.map((comment) => comment.created_at)
                );

                // Get issue timeline events.
                const timelineEvents = await github.paginate(
                  "GET /repos/{owner}/{repo}/issues/{issue_number}/timeline",
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    per_page: 100,
                    headers: {
                      accept:
                        "application/vnd.github+json, application/vnd.github.mockingbird-preview+json",
                    },
                  }
                );

                // Activity from linked pull requests.
                const linkedPRs = timelineEvents.filter(
                  (event) =>
                    event.event === "cross-referenced" &&
                    event.source &&
                    event.source.issue &&
                    event.source.issue.pull_request
                );

                const lastPRActivityAt = latest(
                  linkedPRs.map((reference) => reference.source.issue.updated_at)
                );

                // Activity from commits referencing the issue.
                const referencedCommits = timelineEvents.filter(
                  (event) => event.event === "referenced"
                );

                const lastReferencedCommitAt = latest(
                  referencedCommits.map((event) => event.created_at)
                );

                // Determine when the issue was most recently assigned.
                const assignedEvents = timelineEvents.filter(
                  (event) => event.event === "assigned"
                );

                const lastAssignedAt =
                  latest(assignedEvents.map((event) => event.created_at)) ||
                  issue.created_at;

                // Determine the most recent qualifying activity.
                // Assignment activity is included so a newly reassigned issue
                // gets a fresh inactivity window.
                const lastActivityAt =
                  latest([
                    lastCommentAt,
                    lastPRActivityAt,
                    lastReferencedCommitAt,
                    lastAssignedAt,
                  ]) || issue.created_at;

                const daysSinceActivity = daysSince(lastActivityAt);
                const daysSinceAssigned = daysSince(lastAssignedAt);

                // Do not evaluate issues that have been assigned
                // for less than the nudge threshold.
                if (daysSinceAssigned < nudgeDays) {
                  core.info(
                    `#${issueNumber}: assigned ${daysSinceAssigned.toFixed(1)} ` +
                    `day(s) ago, too recent to check.`
                  );
                  continue;
                }

                const assigneeLogins = issue.assignees.map(
                  (assignee) => assignee.login
                );

                const assigneeMentions = assigneeLogins
                  .map((login) => `@${login}`)
                  .join(", ");

                // Unassign issues that have exceeded the inactivity threshold.
                if (daysSinceActivity >= unassignDays) {
                  await github.rest.issues.removeAssignees({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    assignees: assigneeLogins,
                  });

                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    body:
                      `Unassigning this so it's visible to others. ` +
                      `${assigneeMentions}, thanks for picking it up. ` +
                      `Feel free to reclaim it any time.`,
                  });

                  core.info(
                    `#${issueNumber}: unassigned ` +
                    `(${daysSinceActivity.toFixed(1)} day(s) since activity).`
                  );

                  continue;
                }

                // Nudge issues that have reached the inactivity threshold.
                if (daysSinceActivity >= nudgeDays) {
                  // Prevent the workflow from posting the same nudge repeatedly.
                  const latestNudgeAt = latest(
                    comments
                      .filter(
                        (comment) =>
                          comment.user.type === "Bot" &&
                          comment.body.includes(nudgeMarker)
                      )
                      .map((comment) => comment.created_at)
                  );

                  const alreadyNudged =
                    latestNudgeAt && new Date(latestNudgeAt) > new Date(lastActivityAt);

                  if (alreadyNudged) {
                    core.info(
                      `#${issueNumber}: nudge already posted, skipping.`
                    );
                    continue;
                  }

                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    body:
                      `${nudgeMarker}\n` +
                      `${assigneeMentions}, this has been quiet for ` +
                      `${nudgeDays} days. No pressure at all, just checking ` +
                      `if you're still working on it. If life got busy, ` +
                      `totally fine. Reply here or add the \`${keepLabel}\` ` +
                      `label if you want to hold it, otherwise it'll go ` +
                      `back in the pool in ${unassignDays - nudgeDays} more days.`,
                  });

                  core.info(
                    `#${issueNumber}: nudge posted ` +
                    `(${daysSinceActivity.toFixed(1)} day(s) since activity).`
                  );
                } else {
                  core.info(
                    `#${issueNumber}: active ` +
                    `(${daysSinceActivity.toFixed(1)} day(s) since activity), ` +
                    `no action.`
                  );
                }
              } catch (error) {
                const errorMessage =
                  error instanceof Error ? error.message : String(error);

                core.warning(
                  `#${issueNumber}: failed to process issue: ${errorMessage}`
                );
              }
            }