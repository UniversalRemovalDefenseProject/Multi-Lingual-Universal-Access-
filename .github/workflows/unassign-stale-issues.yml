name: Nudge and unassign stale issues

on:
  schedule:
    - cron: '0 12 * * *'  # runs daily at 12:00 UTC
  workflow_dispatch: {}

env:
  NUDGE_DAYS: 10               # days of inactivity before a nudge comment is posted
  UNASSIGN_DAYS: 14            # days of inactivity before the issue is unassigned
  KEEP_LABEL: keep-assigned    # issues with this label are excluded from nudging and unassignment

permissions:
  issues: write
  pull-requests: read

jobs:
  check-stale-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Check assigned issues for staleness
        uses: actions/github-script@v7
        env:
          NUDGE_DAYS: ${{ env.NUDGE_DAYS }}
          UNASSIGN_DAYS: ${{ env.UNASSIGN_DAYS }}
          KEEP_LABEL: ${{ env.KEEP_LABEL }}
        with:
          script: |
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });

            // Keep only real issues with an assignee
            const assignedIssues = openIssues.filter(
              (item) => !item.pull_request && item.assignees && item.assignees.length > 0
            );

            core.info(`Found ${assignedIssues.length} open, assigned issue(s) to evaluate.`);

            const nudgeDays = Number(process.env.NUDGE_DAYS);
            const unassignDays = Number(process.env.UNASSIGN_DAYS);
            const keepLabel = process.env.KEEP_LABEL;
            const now = new Date();

            function daysSince(dateString) {
              if (!dateString) return Infinity;
              const then = new Date(dateString);
              return (now - then) / (1000 * 60 * 60 * 24);
            }

            function latest(timestamps) {
              const valid = timestamps.filter(Boolean);
              return valid.length > 0 ? valid.reduce((a, b) => (a > b ? a : b)) : null;
            }

            for (const issue of assignedIssues) {
              const issueNumber = issue.number;

              // Compute activity and assignment timestamps
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100,
              });
              // Exclude bot comments
              const humanComments = comments.filter((c) => c.user.type !== "Bot");
              const lastCommentAt = latest(humanComments.map((c) => c.created_at));

              const timelineEvents = await github.paginate(github.rest.issues.listEventsForTimeline, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100,
              });

              const linkedPRs = timelineEvents.filter(
                (e) => e.event === "cross-referenced" && e.source && e.source.issue && e.source.issue.pull_request
              );
              const lastPRActivityAt = latest(linkedPRs.map((ref) => ref.source.issue.updated_at));

              const referencedCommits = timelineEvents.filter((e) => e.event === "referenced");
              const lastReferencedCommitAt = latest(referencedCommits.map((e) => e.created_at));

              const assignedEvents = timelineEvents.filter((e) => e.event === "assigned");
              const lastAssignedAt = latest(assignedEvents.map((e) => e.created_at)) || issue.created_at;

              const lastActivityAt =
                latest([lastCommentAt, lastPRActivityAt, lastReferencedCommitAt]) || issue.created_at;

              const daysSinceActivity = daysSince(lastActivityAt);
              const daysSinceAssigned = daysSince(lastAssignedAt);

              // Skip keep-assigned labels
              const hasKeepLabel = issue.labels.some((l) => l.name === keepLabel);
              if (hasKeepLabel) {
                core.info(`#${issueNumber}: has "${keepLabel}" label, skipping.`);
                continue;
              }
              if (daysSinceAssigned < nudgeDays) {
                core.info(`#${issueNumber}: assigned ${daysSinceAssigned.toFixed(1)} day(s) ago, too recent to check.`);
                continue;
              }

              // Take nudge or unassign action
              const assigneeLogins = issue.assignees.map((a) => a.login);
              const assigneeMentions = assigneeLogins.map((login) => `@${login}`).join(", ");

              if (daysSinceActivity >= unassignDays) {
                await github.rest.issues.removeAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  assignees: assigneeLogins,
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body:
                    `This issue has had no activity for ${unassignDays}+ days and has been unassigned. ` +
                    `It's now open for anyone to pick up.`,
                });
                core.info(`#${issueNumber}: unassigned (${daysSinceActivity.toFixed(1)} day(s) since activity).`);
              } else if (daysSinceActivity >= nudgeDays) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body:
                    `${assigneeMentions}, this issue has had no activity for ${nudgeDays}+ days. ` +
                    `Are you still working on it? If so, add the "${keepLabel}" label to prevent it from ` +
                    `being unassigned. Otherwise, it will be unassigned in ${unassignDays - nudgeDays} more day(s).`,
                });
                core.info(`#${issueNumber}: nudge posted (${daysSinceActivity.toFixed(1)} day(s) since activity).`);
              } else {
                core.info(`#${issueNumber}: active (${daysSinceActivity.toFixed(1)} day(s) since activity), no action.`);
              }
            }